server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos de la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La API vive en el contenedor "api"; el navegador llama a /api (mismo origen)
    # y nginx lo redirige, evitando CORS y puertos cruzados.
    # El resolver de Docker (127.0.0.11) + una variable difieren la resolución del
    # nombre a cada petición, para que nginx arranque aunque la API aún no esté lista
    # (devuelve 502 temporal en vez de negarse a iniciar).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $monetra_api http://api:5127;
        proxy_pass         $monetra_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

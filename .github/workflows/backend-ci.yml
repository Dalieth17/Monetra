name: Backend CI

on:
  push:
    branches: [DEV, QA, main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [DEV, QA, main]
    paths: ["backend/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/Monetra.sln

      - name: Build
        run: dotnet build backend/Monetra.sln --configuration Release --no-restore

      - name: Test (Gate 2 - 100% requerido)
        run: dotnet test backend/Monetra.sln --configuration Release --no-build --verbosity normal
